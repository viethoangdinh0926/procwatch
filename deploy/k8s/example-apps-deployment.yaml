# Demo stack in one pod: agentd + Java/Python/Go apps.
#
# Apps reach agentd at 127.0.0.1:4318 (shared network namespace). Java/Python
# use LD_PRELOAD; Go uses procwatch-wrap. Tables are keyed by PROCWATCH_LABEL.
#
# Build/push images first, e.g.:
#   make agent-x86_64 && make agent-musl-x86_64
#   docker build -f deploy/Dockerfile.agentd -t procwatch/agentd:latest .
#   docker build -f deploy/Dockerfile.codemodules -t procwatch/codemodules:latest .
#   docker build -f examples/java/Dockerfile -t procwatch/checkout:latest examples
#   docker build -f examples/python/Dockerfile -t procwatch/payments:latest examples
#   docker build -f examples/go/Dockerfile -t procwatch/inventory:latest examples
---
apiVersion: v1
kind: Namespace
metadata:
  name: procwatch
---
apiVersion: v1
kind: Secret
metadata:
  name: procwatch-db
  namespace: procwatch
type: Opaque
stringData:
  # Replace with your TimescaleDB endpoint before applying.
  conninfo: "postgresql://procwatcher:procwatcherpw@timescaledb.procwatch.svc:5432/procwatcherdb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procwatch-examples
  namespace: procwatch
  labels:
    app.kubernetes.io/name: procwatch-examples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: procwatch-examples
  template:
    metadata:
      labels:
        app.kubernetes.io/name: procwatch-examples
    spec:
      volumes:
        - name: procwatch-agent
          emptyDir: {}

      initContainers:
        - name: procwatch-install
          image: procwatch/codemodules:latest
          command: ["/bin/sh", "-c", "cp -a /procwatch/agent/. /mnt/procwatch/"]
          volumeMounts:
            - name: procwatch-agent
              mountPath: /mnt/procwatch
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

      containers:
        - name: agentd
          image: procwatch/agentd:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-P"
            - "4318"
          env:
            - name: PROCWATCH_DB
              valueFrom:
                secretKeyRef:
                  name: procwatch-db
                  key: conninfo
            - name: PROCWATCH_SCHEMA
              value: "procwatch"
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          securityContext:
            runAsUser: 0
            privileged: false
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: checkout
          image: procwatch/checkout:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: checkout
              containerPort: 8080
          volumeMounts:
            - name: procwatch-agent
              mountPath: /opt/procwatch/agent
              readOnly: true
          env:
            - name: PORT
              value: "8080"
            # For an Alpine/musl base image use lib-musl/ instead.
            - name: LD_PRELOAD
              value: /opt/procwatch/agent/lib/libprocwatch_inject.so
            - name: PROCWATCH_AGENT_DIR
              value: /opt/procwatch/agent
            - name: PROCWATCH_ENDPOINT
              value: http://127.0.0.1:4318
            - name: PROCWATCH_LABEL
              value: checkout
            - name: OTEL_SERVICE_NAME
              value: checkout-api
            - name: PROCWATCH_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROCWATCH_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(PROCWATCH_POD),k8s.node.name=$(PROCWATCH_NODE_IP)

        - name: payments
          image: procwatch/payments:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: payments
              containerPort: 8081
          volumeMounts:
            - name: procwatch-agent
              mountPath: /opt/procwatch/agent
              readOnly: true
          env:
            - name: PORT
              value: "8081"
            - name: LD_PRELOAD
              value: /opt/procwatch/agent/lib/libprocwatch_inject.so
            - name: PROCWATCH_AGENT_DIR
              value: /opt/procwatch/agent
            - name: PROCWATCH_ENDPOINT
              value: http://127.0.0.1:4318
            - name: PROCWATCH_LABEL
              value: payments
            - name: OTEL_SERVICE_NAME
              value: payments
            - name: PROCWATCH_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROCWATCH_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(PROCWATCH_POD),k8s.node.name=$(PROCWATCH_NODE_IP)

        - name: inventory
          image: procwatch/inventory:latest
          imagePullPolicy: IfNotPresent
          command: ["/opt/procwatch/agent/bin/procwatch-wrap", "--", "/usr/local/bin/inventory"]
          ports:
            - name: inventory
              containerPort: 8082
          volumeMounts:
            - name: procwatch-agent
              mountPath: /opt/procwatch/agent
              readOnly: true
          env:
            - name: PORT
              value: "8082"
            - name: PROCWATCH_ENDPOINT
              value: http://127.0.0.1:4318
            - name: PROCWATCH_LABEL
              value: inventory
            - name: PROCWATCH_SERVICE
              value: inventory
            - name: PROCWATCH_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
