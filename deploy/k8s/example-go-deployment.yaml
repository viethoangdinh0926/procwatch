# Go workload: process metrics only, no code-level tracing.
#
# There is deliberately no init container and no LD_PRELOAD here, because
# neither would do anything. Go binaries are statically linked by default and
# carry no PT_INTERP, so ld.so never runs and LD_PRELOAD is ignored outright.
# Even a cgo-enabled dynamic build gains nothing: the Go runtime issues
# syscalls directly rather than through libc wrappers, and Go has no
# equivalent of JAVA_TOOL_OPTIONS or PYTHONPATH to write into.
#
# The agentd DaemonSet still collects CPU, RSS, and thread counts for these
# pods by walking /proc under hostPID, with no privileges required inside
# this pod and no change to the application image.
#
# PROCWATCH_SERVICE is set so those metric rows carry the same service name
# that spans from Java and Python services use, which keeps a single Grafana
# dashboard coherent across all three runtimes.
#
# For distributed traces from Go, the options are the OpenTelemetry Go SDK
# added to the application, or OpenTelemetry eBPF Instrumentation (OBI) as a
# privileged DaemonSet. OBI was still beta at v0.x as of mid-2026.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app.kubernetes.io/name: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
    spec:
      containers:
        - name: app
          image: inventory:latest
          env:
            - name: PROCWATCH_SERVICE
              value: inventory
            - name: PROCWATCH_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
