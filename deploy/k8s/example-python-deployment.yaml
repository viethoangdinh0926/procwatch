# Python workload with auto-instrumentation injected.
#
# The injector prepends the agent's python/ directory to PYTHONPATH, where a
# version-agnostic sitecustomize.py picks the vendored package tree matching
# the interpreter's ABI. CPython reads PYTHONPATH during
# Py_InitializeFromConfig, long after the injector's constructor has run.
#
# The image's Python minor version must have a matching cp3XX tree in the
# codemodules image; build it with:
#   PYTHON_VERSIONS="3.11 3.12" make runtimes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
    spec:
      volumes:
        - name: procwatch-agent
          emptyDir: {}

      initContainers:
        - name: procwatch-install
          image: procwatch/codemodules:latest
          command: ["/bin/sh", "-c", "cp -a /procwatch/agent/. /mnt/procwatch/"]
          volumeMounts:
            - name: procwatch-agent
              mountPath: /mnt/procwatch
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8080"]
          volumeMounts:
            - name: procwatch-agent
              mountPath: /opt/procwatch/agent
              readOnly: true
          env:
            - name: LD_PRELOAD
              value: /opt/procwatch/agent/lib/libprocwatch_inject.so
            - name: PROCWATCH_AGENT_DIR
              value: /opt/procwatch/agent
            - name: PROCWATCH_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PROCWATCH_ENDPOINT
              value: http://$(PROCWATCH_NODE_IP):4318
            - name: OTEL_SERVICE_NAME
              value: payments
            - name: PROCWATCH_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(PROCWATCH_POD),k8s.node.name=$(PROCWATCH_NODE_IP)
