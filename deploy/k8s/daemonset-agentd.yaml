# procwatch-agentd, one instance per node.
#
# A DaemonSet rather than a per-pod sidecar for two reasons: one OTLP endpoint
# and one database connection per node instead of per pod, and hostPID gives
# a single collector visibility into every process on the node, which is the
# only way Go workloads get observed at all.
---
apiVersion: v1
kind: Namespace
metadata:
  name: procwatch
---
apiVersion: v1
kind: Secret
metadata:
  name: procwatch-db
  namespace: procwatch
type: Opaque
stringData:
  # Replace with your TimescaleDB endpoint before applying.
  conninfo: "postgresql://procwatcher:procwatcherpw@timescaledb.procwatch.svc:5432/procwatcherdb"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: procwatch-agentd
  namespace: procwatch
  labels:
    app.kubernetes.io/name: procwatch-agentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: procwatch-agentd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: procwatch-agentd
    spec:
      # Required for the collector to see application processes. Without it
      # the daemon only sees its own container's PID namespace and no
      # application metrics are produced.
      hostPID: true

      # The receiver binds a node port so injected pods can reach it at
      # status.hostIP without a Service in the path.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      tolerations:
        - operator: Exists

      containers:
        - name: agentd
          image: procwatch/agentd:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-P"
            - "4318"
            - "-i"
            - "10"
          env:
            - name: PROCWATCH_DB
              valueFrom:
                secretKeyRef:
                  name: procwatch-db
                  key: conninfo
            - name: PROCWATCH_SCHEMA
              value: "procwatch"
            - name: PROCWATCH_LABEL
              value: "otel"
          ports:
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
              protocol: TCP
          securityContext:
            # Reading /proc/<pid>/environ for processes owned by other users
            # is what attaches a service name to each metric row. That needs
            # root or CAP_SYS_PTRACE; this is strictly less privileged than
            # the eBPF alternative, which would need CAP_BPF and a privileged
            # container.
            runAsUser: 0
            privileged: false
            capabilities:
              add: ["SYS_PTRACE"]
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 10
            periodSeconds: 30
